# Shared settings. Profile-specific files: application-dev.yml (H2) and application-prod.yml (Postgres).
spring:
  application:
    name: order-management-service
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema in every profile
    properties:
      hibernate:
        default_batch_fetch_size: 50   # loads line items for a whole page in one query (no N+1)
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  mvc:
    problemdetails:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info,prometheus,metrics}
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness and /actuator/health/readiness
      show-details: ${HEALTH_SHOW_DETAILS:never}
      show-components: always
      group:
        readiness:
          include: readinessState,db
  info:
    build:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json

app:
  seed:
    enabled: ${SEED_DEMO_DATA:false}
